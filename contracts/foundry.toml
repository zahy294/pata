[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Sepolia runs Osaka bytecode unchanged (docs/research/foundry.md). Pinned so docs, binary and teammates agree.
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256
# Fixed seed: npm run check gives the same result every run.
seed = "0x1"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
